services:
  postgres:
    image: postgres:16-alpine
    container_name: idt4gdc-postgres
    environment:
      POSTGRES_DB: opsdemo
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d opsdemo"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5434:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  simulator:
    build:
      context: ./simulator
    container_name: idt4gdc-simulator
    environment:
      DATABASE_URL: postgresql://grafana:grafana@postgres:5432/opsdemo
      SEED_HOURS: "24"
      HISTORY_STEP_SECONDS: "300"
      LIVE_INTERVAL_SECONDS: "10"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  forecaster:
    build:
      context: ./forecaster
    container_name: idt4gdc-forecaster
    environment:
      DATABASE_URL: postgresql://grafana:grafana@postgres:5432/opsdemo
      SS_IDS: "10006,3625,22794,27152"
      BACKFILL_DAYS: "7"
      RUN_HOUR: "0"
      DATA_ROOT: /forecast-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./forecaster/forecast-data:/forecast-data:ro

  replay:
    profiles: ["replay"]  # opt-in: docker compose --profile replay up -d --build
    build:
      context: ./replay
    container_name: idt4gdc-replay
    environment:
      DATABASE_URL: postgresql://grafana:grafana@postgres:5432/opsdemo
      EXPORT_DIR: /replay-data/current
      REPLAY_SPEED: "20"
      LIVE_INTERVAL_SECONDS: "10"
      BACKFILL_MINUTES: "20"
      LOOP: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Point at a sim_export_<id>/ directory produced by
      # idt4gdc-digital-twins/loadtest/export_sim.py. Override with:
      #   REPLAY_EXPORT_DIR=../idt4gdc-digital-twins/exports/sim_export_xxx docker compose --profile replay up -d --build
      - ${REPLAY_EXPORT_DIR:-./replay/export}:/replay-data/current:ro

  scheduler:
    build:
      context: ./scheduler
    container_name: idt4gdc-scheduler
    environment:
      DATABASE_URL: postgresql://grafana:grafana@postgres:5432/opsdemo
      CONFIRMATION_SLOTS: "2"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: idt4gdc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/connect_data_centre.json
      GF_INSTALL_PLUGINS: briangann-gauge-panel
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
